# OSMO Combination Workflow — AMR Synthetic Data Generation Pipeline
#
# Stages 1-5 of the AMR navigation pipeline using OSMO groups for
# parallel execution where possible.  Stage 6 (training) is a separate
# workflow so it can be scheduled independently on P-series Capacity Blocks.
#
# Group execution order:
#   scene-setup ──> spatial-analysis ──> trajectory-planning ──> multi-modal-render ──> domain-augmentation
#
# Stage 4 renders rgb + depth + semantic_segmentation in a single
# Replicator BasicWriter pass — the script does not split by modality.
#
# Prerequisites:
#   - OSMO v6.2+ control plane running on the cluster
#   - Container images pushed to a Docker Registry v2-compatible registry.
#     ECR is NOT directly supported: OSMO validates registries with the
#     Docker v2 token protocol, which ECR does not implement. See README
#     for the Skopeo → in-cluster-mirror workaround, or use a public mirror.
#   - RUN_ID and S3_BUCKET must be exported before envsubst
#
# Submit:  envsubst < data-pipeline-workflow.yaml | osmo workflow submit -f -
#
# Monitor: osmo workflow list
#
# Note: OSMO workflow tasks only support: name, lead, image, command, args,
#       resources, inputs. K8s-native fields (env, imagePullSecrets,
#       nodeSelector, tolerations, volumes, timeout, schedulerName,
#       serviceAccountName) are NOT supported and will cause validation errors.
workflow:
  name: amr-data-pipeline-${RUN_ID}

  groups:
    # ── Group 1: Build warehouse USD scene ──────────────────────────────
    - name: scene-setup
      tasks:
        - name: build-scene
          lead: true
          image: ${ISAAC_SIM_IMAGE_URI}
          command: ["/isaac-sim/python.sh"]
          args:
            - |
              /isaac-sim/scripts/stage1_scene_setup.py \
                --s3_bucket ${S3_BUCKET} \
                --run_id ${RUN_ID} \
                --output_dir {{output}}/scene \
                --num_aisles ${NUM_AISLES:-4} \
                --headless
          resources:
            gpu: 1
            cpu: 16
            memory: 32Gi

    # ── Group 2: Compute occupancy grid from scene prims ────────────────
    - name: spatial-analysis
      tasks:
        - name: occupancy-map
          lead: true
          image: ${ISAAC_SIM_IMAGE_URI}
          command: ["/isaac-sim/python.sh"]
          args:
            - |
              /isaac-sim/scripts/stage2_occupancy_map.py \
                --s3_bucket ${S3_BUCKET} \
                --run_id ${RUN_ID} \
                --scene_dir {{input:0}}/scene \
                --output_dir {{output}}/occupancy \
                --headless
          inputs:
            - task: build-scene
          resources:
            gpu: 1
            cpu: 16
            memory: 32Gi

    # ── Group 3: A* trajectory planning ─────────────────────────────────
    - name: trajectory-planning
      tasks:
        - name: trajectory-gen
          lead: true
          image: ${ISAAC_SIM_IMAGE_URI}
          command: ["/isaac-sim/python.sh"]
          args:
            - |
              /isaac-sim/scripts/stage3_trajectory_gen.py \
                --s3_bucket ${S3_BUCKET} \
                --run_id ${RUN_ID} \
                --occupancy_dir {{input:0}}/occupancy \
                --output_dir {{output}}/trajectories \
                --num_trajectories ${NUM_TRAJECTORIES:-10} \
                --headless
          inputs:
            - task: occupancy-map
          resources:
            gpu: 1
            cpu: 16
            memory: 32Gi

    # ── Group 4: Multi-modal rendering (single pass) ────────────────────
    #
    # stage4_render.py renders RGB + depth (distance_to_image_plane) +
    # semantic_segmentation together via a single Replicator BasicWriter
    # pass. This is one task, not three — splitting by modality would
    # require a --render_mode arg that the script does not accept.
    - name: multi-modal-render
      tasks:
        - name: render
          lead: true
          image: ${ISAAC_SIM_IMAGE_URI}
          command: ["/isaac-sim/python.sh"]
          args:
            - |
              /isaac-sim/scripts/stage4_render.py \
                --s3_bucket ${S3_BUCKET} \
                --run_id ${RUN_ID} \
                --scene_dir {{input:0}}/scene \
                --trajectory_dir {{input:1}}/trajectories \
                --output_dir {{output}}/raw-v1 \
                --headless
          inputs:
            - task: build-scene
            - task: trajectory-gen
          resources:
            gpu: 1
            cpu: 16
            memory: 32Gi

    # ── Group 5: Domain augmentation on rendered RGB images ─────────────
    - name: domain-augmentation
      tasks:
        - name: domain-augment
          lead: true
          image: ${COSMOS_IMAGE_URI}
          command: ["python"]
          args:
            - |
              /scripts/stage5_domain_augment.py \
                --s3_bucket ${S3_BUCKET} \
                --run_id ${RUN_ID} \
                --input_dir {{input:0}}/raw-v1 \
                --output_dir {{output}}/augmented-v2
          inputs:
            - task: render
          resources:
            gpu: 1
            cpu: 16
            memory: 32Gi
